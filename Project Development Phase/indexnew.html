<!DOCTYPE html>
<html>
<head>
    <title>Predict HDI Rank</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }

        .container{
            width:50%;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
            color:#1f4e79;
        }

        input{
            width:95%;
            padding:10px;
            margin:10px 0;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#007BFF;
            color:white;
            border:none;
            font-size:18px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Enter HDI Details</h2>

<form action="/predict" method="POST">

<input type="number" step="any" name="life_expectancy"
placeholder="Life Expectancy at Birth" required>

<input type="number" step="any" name="expected_schooling"
placeholder="Expected Years of Schooling" required>

<input type="number" step="any" name="mean_schooling"
placeholder="Mean Years of Schooling" required>

<input type="number" step="any" name="gni"
placeholder="Gross National Income Per Capita" required>

<button type="submit">Predict</button>

</form>

</div>

</body>
</html>
